# CI do Atchei
#
# Em Pull Requests e pushes para `main`: instala, builda e roda os testes (frontend e functions).
# O deploy é feito fora deste workflow (hospedagem própria).
#
# Secret necessário no repositório (Settings > Secrets and variables > Actions):
#   ENV_FILE   Conteúdo do .env do frontend (todas as linhas VITE_...=valor). O build
#              recria o .env a partir desse secret antes de rodar o Vite.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build e Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (frontend)
        run: npm ci

      - name: Recriar .env do frontend (a partir do secret ENV_FILE)
        run: |
          cat > .env <<'ENVEOF'
          ${{ secrets.ENV_FILE }}
          ENVEOF

      - name: Build (tsc + vite)
        run: npm run build

      - name: Testes (frontend)
        run: npm run test:run

      - name: Instalar dependências (functions)
        run: npm ci
        working-directory: functions

      - name: Testes (functions)
        run: npm test
        working-directory: functions
