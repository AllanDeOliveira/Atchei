name: Deploy

on:
  push:
    branches: [main]

# Um deploy por vez; push novo espera o anterior terminar (nunca cancela no meio).
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O .env da raiz é gitignorado — o conteúdo vem do secret do repositório.
      - name: Restaurar .env do front
        env:
          VITE_ENV: ${{ secrets.VITE_ENV }}
        run: printf '%s' "$VITE_ENV" > .env

      # O deploy NÃO limpa variável de ambiente antiga de uma function: duas functions
      # deployadas à mão com APP_BASE_URL=http://localhost:5173 ficaram assim por vários
      # deploys do CI, e quem clicava num link compartilhado era mandado para localhost
      # (2026-09-15). Gravar o .env aqui torna o ambiente das functions determinístico a
      # cada deploy. Só valor público; segredo de verdade vive no Secret Manager.
      - name: Gravar .env das functions
        run: printf 'APP_BASE_URL=https://atchei.app.br\n' > functions/.env

      - name: Testes do app
        run: npm run test:run

      - name: Testes das functions
        working-directory: functions
        run: |
          npm ci
          npm test

      - name: Build do front
        run: npm run build

      # --force confirma sozinho a exclusão de functions removidas do código.
      - name: Deploy (hosting + rules + functions)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only hosting,firestore:rules,storage,functions --force --project atchei
