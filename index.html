<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- atchei.web.app e atchei.firebaseapp.com são os domínios padrão do Firebase e não podem ser
         desligados: manda tudo para o domínio oficial, e o Google consolida a indexação nele. -->
    <script>
      (function () {
        var h = location.hostname;
        if (h === 'atchei.web.app' || h === 'atchei.firebaseapp.com') {
          location.replace('https://atchei.app.br' + location.pathname + location.search + location.hash);
        }
      })();
    </script>
    <link rel="icon" type="image/png" href="/logo.png?v=6" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Atchei" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google-site-verification" content="6yOIZEzWF6p5IWTW-SB_4FPyixYrnnHMmd01bpUhuFg" />
    <meta name="google-site-verification" content="-7CbPoEX70s1SUB0ZUcaWTx1koxVDtRc5RhP-pHooyo" />
    <title>Atchei - Eventos e ingressos</title>
    <meta name="description" content="Descubra e crie os melhores eventos, festas e encontros na sua região." />
    <link rel="canonical" href="https://atchei.app.br/" />

    <!-- Open Graph / Meta -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://atchei.app.br/" />
    <meta property="og:title" content="Atchei - Eventos e ingressos" />
    <meta property="og:description" content="Descubra e crie os melhores eventos, festas e encontros na sua região." />
    <!-- Mesmo padrão da function de OG (functions/ogPreview.js). Um banner 1200x630 daria o cartão grande. -->
    <meta property="og:image" content="https://atchei.app.br/apple-touch-icon.png" />

    <meta name="theme-color" content="#FFFCF8" />

    <!-- Dados estruturados: ensinam ao Google que "Atchei" é esta marca/site -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Atchei",
          "url": "https://atchei.app.br/",
          "logo": "https://atchei.app.br/logo.png",
          "email": "contato.atchei@gmail.com",
          "sameAs": ["https://instagram.com/atchei.app"],
          "address": { "@type": "PostalAddress", "addressLocality": "Cáceres", "addressRegion": "MT", "addressCountry": "BR" }
        },
        {
          "@type": "WebSite",
          "name": "Atchei",
          "alternateName": "Atchei Eventos",
          "url": "https://atchei.app.br/"
        }
      ]
    }
    </script>

    <!-- Google Fonts — Plus Jakarta Sans (família unificada) -->
    <!-- Fonte servida daqui (public/fonts): o CSS do Google Fonts bloqueava a primeira pintura por
         ~0,7 s no celular. O preload adianta o arquivo principal; os @font-face estão em src/index.css. -->
    <link rel="preload" href="/fonts/plus-jakarta-sans-v12-latin.woff2" as="font" type="font/woff2" crossorigin>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
